
<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Pametni načrtovalec izletov</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fb;
        }

        h1, h2 {
            color: #243b53;
        }

        .kartica {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        .filtri {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
        }

        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #status {
            color: #555;
        }
    </style>
</head>

<body>
    <h1>Pametni načrtovalec izletov</h1>
    <p>Analiza turizma na podlagi odprtih podatkov SURS.</p>

    <div class="kartica">
        <h2>Turistični obiski po občinah</h2>

        <div class="filtri">
            <div>
                <label for="obcina">Občina</label>
                <select id="obcina"></select>
            </div>

            <div>
                <label for="leto">Leto</label>
                <select id="leto"></select>
            </div>

            <div>
                <label for="meritev">Meritev</label>
                <select id="meritev">
                    <option>Prihodi turistov</option>
                    <option>Prenočitve turistov</option>
                </select>
            </div>
        </div>

        <p id="status">Nalagam podatke ...</p>
        <canvas id="turizemGraf"></canvas>
    </div>

    <script>
        let graf;

        const obcinaSelect = document.getElementById('obcina');
        const letoSelect = document.getElementById('leto');
        const meritevSelect = document.getElementById('meritev');
        const status = document.getElementById('status');

        async function naloziMoznosti() {
            const odgovor = await fetch('/api/moznosti');
            if (!odgovor.ok) {
                throw new Error('Napaka pri nalaganju možnosti.');
            }

            const podatki = await odgovor.json();

            podatki.obcine.forEach(obcina => {
                const option = document.createElement('option');
                option.value = obcina;
                option.textContent = obcina;
                obcinaSelect.appendChild(option);
            });

            podatki.leta.forEach(leto => {
                const option = document.createElement('option');
                option.value = leto;
                option.textContent = leto;
                letoSelect.appendChild(option);
            });

            obcinaSelect.value = 'Bled';
            letoSelect.value = podatki.leta.includes('2025')
                ? '2025'
                : podatki.leta[podatki.leta.length - 1];
        }

        async function naloziGraf() {
            status.textContent = 'Nalagam podatke ...';

            const parametri = new URLSearchParams({
                obcina: obcinaSelect.value,
                leto: letoSelect.value,
                meritev: meritevSelect.value
            });

            try {
                const odgovor = await fetch('/api/turizem?' + parametri);
                if (!odgovor.ok) {
                    throw new Error('Podatkov ni bilo mogoče pridobiti.');
                }

                const rezultat = await odgovor.json();

                const oznake = rezultat.podatki.map(p => p.mesec);
                const vrednosti = rezultat.podatki.map(p => p.vrednost);

                if (graf) {
                    graf.destroy();
                }

                graf = new Chart(
                    document.getElementById('turizemGraf'),
                    {
                        type: 'bar',
                        data: {
                            labels: oznake,
                            datasets: [{
                                label: rezultat.meritev,
                                data: vrednosti,
                                backgroundColor: '#4285f4'
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    }
                );

                status.textContent =
                    `Prikaz: ${rezultat.obcina}, ${rezultat.leto}`;

            } catch (napaka) {
                status.textContent = napaka.message;
            }
        }

        async function zacetek() {
            try {
                await naloziMoznosti();
                await naloziGraf();
            } catch (napaka) {
                status.textContent = napaka.message;
            }
        }

        obcinaSelect.addEventListener('change', naloziGraf);
        letoSelect.addEventListener('change', naloziGraf);
        meritevSelect.addEventListener('change', naloziGraf);

        zacetek();
    </script>
</body>
</html>
