
<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Pametni načrtovalec izletov</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fb;
        }

        h1, h2 {
            color: #243b53;
        }

        .kartica {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        .filtri {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
        }

        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #status {
            color: #555;
        }
        
.ai-kartica {
    margin-top: 30px;
}

.ai-opis {
    color: #526477;
    line-height: 1.6;
}

.ai-obrazec {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
    margin-top: 20px;
}

.ai-obrazec input,
.ai-obrazec select {
    width: 100%;
    box-sizing: border-box;
    padding: 11px;
    border: 1px solid #ccd5df;
    border-radius: 7px;
    background: white;
}

.ai-gumb {
    margin-top: 22px;
    padding: 13px 22px;
    border: none;
    border-radius: 8px;
    background: #4285f4;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.ai-gumb:hover {
    background: #2769d2;
}

.ai-gumb:disabled {
    opacity: 0.6;
    cursor: wait;
}

#ai-status {
    margin-top: 16px;
    color: #526477;
}

#ai-rezultat {
    margin-top: 20px;
}

.aktivnost {
    background: #f5f7fb;
    border-left: 4px solid #4285f4;
    padding: 15px;
    margin: 12px 0;
    border-radius: 6px;
}

.aktivnost h3 {
    margin-top: 0;
    color: #243b53;
}

    </style>
</head>

<body>
    <h1>Pametni načrtovalec izletov</h1>
    <p>Analiza turizma na podlagi odprtih podatkov SURS.</p>

    <div class="kartica">
        <h2>Turistični obiski po občinah</h2>

        <div class="filtri">
            <div>
                <label for="obcina">Občina</label>
                <select id="obcina"></select>
            </div>

            <div>
                <label for="leto">Leto</label>
                <select id="leto"></select>
            </div>

            <div>
                <label for="meritev">Meritev</label>
                <select id="meritev">
                    <option>Prihodi turistov</option>
                    <option>Prenočitve turistov</option>
                </select>
            </div>
        </div>

        <p id="status">Nalagam podatke ...</p>
        <canvas id="turizemGraf"></canvas>
    </div>

<!-- AI NAČRTOVALEC IZLETOV -->
<div class="kartica ai-kartica">
    <h2>✨ AI načrtovalec izletov</h2>

    <p class="ai-opis">
        Izberi kraj, datum in svoje želje.
        Umetna inteligenca Gemini bo pripravila
        prilagojen načrt izleta z aktivnostmi in urami.
    </p>

    <form id="ai-form">
        <div class="ai-obrazec">
            <div>
                <label for="ai-kraj">Kraj izleta</label>
                <input
                    type="text"
                    id="ai-kraj"
                    value="Bled"
                    placeholder="Npr. Bled"
                    maxlength="150"
                    required>
            </div>

            <div>
                <label for="ai-datum">Datum izleta</label>
                <input
                    type="date"
                    id="ai-datum"
                    required>
            </div>

            <div>
                <label for="ai-vrsta">Vrsta aktivnosti</label>
                <select id="ai-vrsta">
                    <option value="Narava in pohodništvo">
                        Narava in pohodništvo
                    </option>
                    <option value="Kulturne znamenitosti">
                        Kulturne znamenitosti
                    </option>
                    <option value="Družinski izlet">
                        Družinski izlet
                    </option>
                    <option value="Romantični izlet">
                        Romantični izlet
                    </option>
                    <option value="Aktivni izlet">
                        Aktivni izlet
                    </option>
                    <option value="Kulinarika">
                        Kulinarika
                    </option>
                </select>
            </div>

            <div>
                <label for="ai-trajanje">Trajanje izleta</label>
                <select id="ai-trajanje">
                    <option value="Pol dneva">Pol dneva</option>
                    <option value="Cel dan" selected>Cel dan</option>
                    <option value="Dva dni">Dva dni</option>
                </select>
            </div>
        </div>

        <button type="submit" class="ai-gumb" id="ai-gumb">
            ✨ Ustvari AI načrt izleta
        </button>
    </form>

    <p id="ai-status" role="status" aria-live="polite"></p>
    <div id="ai-rezultat"></div>
</div>

    <script>
        let graf;

        const obcinaSelect = document.getElementById('obcina');
        const letoSelect = document.getElementById('leto');
        const meritevSelect = document.getElementById('meritev');
        const status = document.getElementById('status');

        async function naloziMoznosti() {
            const odgovor = await fetch('/api/moznosti');
            if (!odgovor.ok) {
                throw new Error('Napaka pri nalaganju možnosti.');
            }

            const podatki = await odgovor.json();

            podatki.obcine.forEach(obcina => {
                const option = document.createElement('option');
                option.value = obcina;
                option.textContent = obcina;
                obcinaSelect.appendChild(option);
            });

            podatki.leta.forEach(leto => {
                const option = document.createElement('option');
                option.value = leto;
                option.textContent = leto;
                letoSelect.appendChild(option);
            });

            obcinaSelect.value = 'Bled';
            letoSelect.value = podatki.leta.includes('2025')
                ? '2025'
                : podatki.leta[podatki.leta.length - 1];
        }

        async function naloziGraf() {
            status.textContent = 'Nalagam podatke ...';

            const parametri = new URLSearchParams({
                obcina: obcinaSelect.value,
                leto: letoSelect.value,
                meritev: meritevSelect.value
            });

            try {
                const odgovor = await fetch('/api/turizem?' + parametri);
                if (!odgovor.ok) {
                    throw new Error('Podatkov ni bilo mogoče pridobiti.');
                }

                const rezultat = await odgovor.json();

                const oznake = rezultat.podatki.map(p => p.mesec);
                const vrednosti = rezultat.podatki.map(p => p.vrednost);

                if (graf) {
                    graf.destroy();
                }

                graf = new Chart(
                    document.getElementById('turizemGraf'),
                    {
                        type: 'bar',
                        data: {
                            labels: oznake,
                            datasets: [{
                                label: rezultat.meritev,
                                data: vrednosti,
                                backgroundColor: '#4285f4'
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    }
                );

                status.textContent =
                    `Prikaz: ${rezultat.obcina}, ${rezultat.leto}`;

            } catch (napaka) {
                status.textContent = napaka.message;
            }
        }

        async function zacetek() {
            try {
                await naloziMoznosti();
                await naloziGraf();
            } catch (napaka) {
                status.textContent = napaka.message;
            }
        }

        obcinaSelect.addEventListener('change', naloziGraf);
        letoSelect.addEventListener('change', naloziGraf);
        meritevSelect.addEventListener('change', naloziGraf);

        zacetek();
        
// ======================================
// AI NAČRTOVALEC IZLETOV
// ======================================

const aiForm = document.getElementById('ai-form');
const aiGumb = document.getElementById('ai-gumb');
const aiStatus = document.getElementById('ai-status');
const aiRezultat = document.getElementById('ai-rezultat');

aiForm.addEventListener('submit', async (dogodek) => {
    dogodek.preventDefault();

    const podatki = {
        kraj: document.getElementById('ai-kraj').value,
        datum: document.getElementById('ai-datum').value,
        vrsta: document.getElementById('ai-vrsta').value,
        trajanje: document.getElementById('ai-trajanje').value
    };

    aiGumb.disabled = true;
    aiGumb.textContent = 'AI pripravlja načrt ...';
    aiStatus.textContent = 'Počakaj, ustvarjam tvoj izlet ...';
    aiRezultat.replaceChildren();

    try {
        const odgovor = await fetch('/api/ai-izlet', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(podatki)
        });

        const nacrt = await odgovor.json();

        if (!odgovor.ok) {
            throw new Error(
                nacrt.napaka || 'Napaka pri ustvarjanju izleta.'
            );
        }

        // Prikaz naslova
        const naslov = document.createElement('h2');
        naslov.textContent = nacrt.naslov;
        aiRezultat.appendChild(naslov);

        // Prikaz opisa
        const opis = document.createElement('p');
        opis.textContent = nacrt.opis;
        aiRezultat.appendChild(opis);

        // Prikaz aktivnosti
        nacrt.aktivnosti.forEach(aktivnost => {
            const kartica = document.createElement('div');
            kartica.className = 'aktivnost';

            const ime = document.createElement('h3');
            ime.textContent =
                `${aktivnost.ura} – ${aktivnost.naziv}`;

            const podrobnosti = document.createElement('p');
            podrobnosti.textContent = aktivnost.opis;

            kartica.appendChild(ime);
            kartica.appendChild(podrobnosti);
            aiRezultat.appendChild(kartica);
        });

        aiStatus.textContent = 'Načrt izleta je pripravljen!';

    } catch (napaka) {
        aiStatus.textContent = napaka.message;
    } finally {
        aiGumb.disabled = false;
        aiGumb.textContent = '✨ Ustvari AI načrt izleta';
    }
});

    </script>
</body>
</html>
